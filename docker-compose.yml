version: '3.8'

services:
  lexiguard-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: lexiguard-ai:latest
    container_name: lexiguard-workspace
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=lexiguard_production_secret_key_change_in_prod_12345
      - JWT_EXPIRES_IN=7d
      - AI_PROVIDER=mock
      - GEMINI_API_KEY=
      - ANTHROPIC_API_KEY=
      - CLIENT_URL=http://localhost:5000
    volumes:
      - lexiguard_data:/app/server/prisma
      - lexiguard_uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  lexiguard_data:
    driver: local
  lexiguard_uploads:
    driver: local
